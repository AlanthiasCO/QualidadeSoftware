[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "public-software-hotspots"
version = "1.4.3"
description = "Pipeline longitudinal de hotspots para priorizacao de inspecao de divida tecnica"
requires-python = ">=3.11"
dependencies = [
  "pydriller>=2.7",
  "lizard>=1.17",
  "pandas>=2.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hotspots = "hotspots.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
